name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: Cœur Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv && uv pip install -e ".[dev,linux]"
      - name: Règle de version (chiffres de 0 à 9, fichiers cohérents)
        run: python3 ../scripts/bump_version.py --check
      - name: Lint (ruff)
        run: .venv/bin/ruff check projia tests
      - name: Typage (mypy)
        run: .venv/bin/mypy
      - name: Tests (pytest, fournisseurs simulés)
        run: .venv/bin/pytest -q
      - name: Vulnérabilités des dépendances verrouillées (aucune exception silencieuse)
        if: matrix.python == '3.14'
        run: |
          uv export --frozen --extra linux --no-dev --no-emit-project --no-hashes --output-file /tmp/projia-requirements.txt
          uvx pip-audit -r /tmp/projia-requirements.txt --disable-pip --no-deps
      - name: Tests de concurrence répétés 3 fois (un test instable est un bug)
        if: matrix.python == '3.14'
        run: |
          for i in 1 2 3; do
            .venv/bin/pytest -q -p no:cacheprovider tests/test_threadmemory.py tests/test_terminal.py tests/test_resilience.py tests/test_sync_conflict.py tests/test_explainer.py tests/test_router.py || exit 1
          done
      - name: Budget de latence (sélection du modèle < 20 ms)
        run: .venv/bin/pytest -q tests/test_router.py -k selection_is_fast

  minimal:
    name: Cœur — dépendances minimales (comme sous Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv venv && uv pip install -e . pytest pytest-asyncio respx
      - run: .venv/bin/python -c "from projia.server.app import create_app; create_app()"
      - run: .venv/bin/pytest -q

  app:
    name: Application Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Versions et avis des dépendances Flutter
        run: flutter pub outdated
      - name: Licences Flutter (Apache-2.0, MIT, BSD seulement)
        run: python3 ../scripts/check_flutter_licenses.py .dart_tool/package_config.json
      - run: flutter analyze
      - run: flutter test
