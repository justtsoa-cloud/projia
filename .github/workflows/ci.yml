name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: Cœur Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv && uv pip install -e ".[dev,linux]"
      - name: Lint (ruff)
        run: .venv/bin/ruff check tontolo tests
      - name: Typage (mypy)
        run: .venv/bin/mypy
      - name: Tests (pytest, fournisseurs simulés)
        run: .venv/bin/pytest -q
      - name: Budget de latence (sélection du modèle < 20 ms)
        run: .venv/bin/pytest -q tests/test_router.py -k selection_is_fast

  minimal:
    name: Cœur — dépendances minimales (comme sous Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv venv && uv pip install -e . pytest pytest-asyncio respx
      - run: .venv/bin/python -c "from tontolo.server.app import create_app; create_app()"
      - run: .venv/bin/pytest -q

  app:
    name: Application Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
