name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SERIOUS_PYTHON_VERSION: "3.14"
  # Statistiques anonymes (docs/STATS.md) : inactives tant que les variables ne sont pas définies.
  STATS_DEFINES: >-
    --dart-define=TONTOLO_STATS_URL=${{ vars.STATS_URL }}
    --dart-define=TONTOLO_STATS_KEY=${{ vars.STATS_ANON_KEY }}
  # Budgets (section 11) — mesurés en phase 1, la release échoue s'ils sont dépassés.
  BUDGET_APK_MB: "30"
  BUDGET_APPIMAGE_MB: "55"
  BUDGET_WHEEL_KB: "220"

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  python:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cd core && uv build
      - name: Budget de taille de la roue
        run: |
          size=$(( $(stat -c %s core/dist/*.whl) / 1024 ))
          echo "Roue : ${size} Ko (budget ${BUDGET_WHEEL_KB} Ko)"
          test "$size" -le "$BUDGET_WHEEL_KB"
      - uses: actions/upload-artifact@v4
        with: {name: python, path: core/dist/*}

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - uses: astral-sh/setup-uv@v6
      - name: Empaquetage du cœur Python (Android)
        # Téléchargements de Python parfois coupés par le réseau de GitHub : 3 essais.
        run: |
          cd app && flutter pub get && cd ..
          for i in 1 2 3; do scripts/package_python.sh Android && exit 0; echo "Essai $i échoué"; sleep 30; done
          exit 1
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tontolo.jks"
            echo "TONTOLO_KEYSTORE=$RUNNER_TEMP/tontolo.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucun keystore : APK signés avec la clé de débogage."
          fi
      - name: Pré-téléchargement de Python pour Android (avec nouveaux essais)
        # Le téléchargement intégré au plugin échoue parfois sur les runners : on remplit son
        # cache d'avance, avec plusieurs essais, à partir de la version qu'il attend.
        run: |
          props=$(find ~/.pub-cache/hosted/pub.dev -path "*serious_python_android-*/android/python_versions.properties" | sort -V | tail -1)
          date=$(grep '^python_build_release_date=' "$props" | cut -d= -f2)
          full=$(grep '^3.14.full_version=' "$props" | cut -d= -f2)
          dir=~/.flet/cache/python-build/v$full
          mkdir -p "$dir"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f=python-android-dart-$full-$abi.tar.gz
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$dir/$f" \
              "https://github.com/flet-dev/python-build/releases/download/$date/$f"
            tar -tzf "$dir/$f" > /dev/null
          done
      - name: Construction des APK par ABI
        env:
          TONTOLO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TONTOLO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TONTOLO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd app
          export SERIOUS_PYTHON_SITE_PACKAGES=$PWD/build/site-packages-Android
          export SERIOUS_PYTHON_APP=$PWD/build/python-app-Android
          flutter build apk --release --split-per-abi $STATS_DEFINES || {
            echo "::warning::Échec de la construction, nouvel essai dans 30 s"
            sleep 30
            flutter build apk --release --split-per-abi $STATS_DEFINES
          }
          mkdir -p ../dist
          v=${GITHUB_REF_NAME#v}
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk ../dist/tontolo-$v-$abi.apk
          done
      - name: Budget de taille des APK
        run: |
          for f in dist/*.apk; do
            size=$(( $(stat -c %s "$f") / 1048576 ))
            echo "$f : ${size} Mo (budget ${BUDGET_APK_MB} Mo)"
            test "$size" -le "$BUDGET_APK_MB"
          done
      - uses: actions/upload-artifact@v4
        with: {name: android, path: dist/*.apk}

  linux:
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev \
            libjsoncpp-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfuse2 file
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - uses: astral-sh/setup-uv@v6
      - name: Empaquetage du cœur Python (Linux)
        # Téléchargements de Python parfois coupés par le réseau de GitHub : 3 essais.
        run: |
          cd app && flutter pub get && cd ..
          for i in 1 2 3; do scripts/package_python.sh Linux && exit 0; echo "Essai $i échoué"; sleep 30; done
          exit 1
      - name: Construction Linux
        run: |
          cd app
          export SERIOUS_PYTHON_SITE_PACKAGES=$PWD/build/site-packages-Linux
          export SERIOUS_PYTHON_APP=$PWD/build/python-app-Linux
          flutter build linux --release $STATS_DEFINES
      - name: AppImage
        run: scripts/build_appimage.sh "${GITHUB_REF_NAME#v}"
      - name: Budget de taille de l'AppImage
        run: |
          f=$(ls dist/*.AppImage)
          size=$(( $(stat -c %s "$f") / 1048576 ))
          echo "$f : ${size} Mo (budget ${BUDGET_APPIMAGE_MB} Mo)"
          test "$size" -le "$BUDGET_APPIMAGE_MB"
      - uses: actions/upload-artifact@v4
        with: {name: linux, path: dist/*.AppImage}

  publish:
    needs: [python, android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: Poster de la version (fr, en, mg)
        # Consigne permanente : chaque version publiée a son poster illustré (docs/RELEASING.md),
        # joint à la release et embarqué dans l'application (fenêtre « Nouveautés »).
        run: |
          v=${GITHUB_REF_NAME#v}
          for l in fr en mg; do
            f="press/posters/v$v/Tontolo-$v-poster-$l.png"
            test -f "$f" || { echo "::error::Poster absent : $f (python3 press/posters/build_poster.py $v)"; exit 1; }
            cp "$f" dist/
          done
          test "$(cat app/assets/posters/version.txt)" = "$v" || { echo "::error::Poster embarqué d'une autre version"; exit 1; }
      - name: Empreintes et rapport de taille
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          { echo "| Fichier | Taille |"; echo "|---|---|"
            for f in *; do [ "$f" = SHA256SUMS ] || echo "| $f | $(du -h "$f" | cut -f1) |"; done; } > ../size-report.md
          cat ../size-report.md
      - name: Compatibilité des mises à jour (saut de versions depuis 0.2.0)
        # Les applications déjà installées (0.2.0 et suivantes) cherchent ces noms exacts :
        # les changer casserait leur mise à jour automatique.
        run: |
          v=${GITHUB_REF_NAME#v}
          for f in "tontolo-$v-arm64-v8a.apk" "tontolo-$v-armeabi-v7a.apk" "tontolo-$v-x86_64.apk" \
                   "Tontolo-$v-x86_64.AppImage" SHA256SUMS; do
            test -f "dist/$f" || { echo "::error::Fichier attendu absent : $f"; exit 1; }
            [ "$f" = SHA256SUMS ] || grep -q "  $f\$" dist/SHA256SUMS
          done
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG sans section $v"; exit 1; }
          # Règle de version : x.y.9 → x.(y+1).0, x.9.9 → (x+1).0.0 (docs/RELEASING.md).
          python3 scripts/bump_version.py --check-tag "$GITHUB_REF_NAME"
          # Le numéro de build Android doit croître, sinon Android refuse la mise à jour.
          build=$(grep '^version:' app/pubspec.yaml | sed 's/.*+//')
          prev=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          if [ -n "$prev" ]; then
            pbuild=$(git show "$prev:app/pubspec.yaml" | grep '^version:' | sed 's/.*+//')
            echo "build $build (précédent $prev : $pbuild)"
            test "$build" -gt "$pbuild"
          fi
      - name: Notes de version (CHANGELOG)
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > changes.md
          dl="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          size() { du -h "dist/$1" | cut -f1; }
          {
            echo "[![Tontolo $v : les nouveautés en un coup d'œil]($dl/Tontolo-$v-poster-fr.png)]($dl/Tontolo-$v-poster-fr.png)"
            echo
            echo "🖼️ Poster : [Français]($dl/Tontolo-$v-poster-fr.png) · [English]($dl/Tontolo-$v-poster-en.png) · [Malagasy]($dl/Tontolo-$v-poster-mg.png)"
            echo
            echo "## ⬇️ Télécharger"
            echo
            echo "| Fichier | Pour qui | Taille |"
            echo "|---|---|---|"
            echo "| [**tontolo-$v-arm64-v8a.apk**]($dl/tontolo-$v-arm64-v8a.apk) | 📱 **Android — le bon choix dans 95 % des cas** (téléphones et tablettes depuis 2016, Android 7 à 16) | $(size tontolo-$v-arm64-v8a.apk) |"
            echo "| [tontolo-$v-armeabi-v7a.apk]($dl/tontolo-$v-armeabi-v7a.apk) | 📱 Android ancien ou d'entrée de gamme (32 bits) — si le premier affiche « non compatible » | $(size tontolo-$v-armeabi-v7a.apk) |"
            echo "| [tontolo-$v-x86_64.apk]($dl/tontolo-$v-x86_64.apk) | 💻 Émulateurs, Chromebooks, Android sur PC (Intel/AMD) | $(size tontolo-$v-x86_64.apk) |"
            echo "| [**Tontolo-$v-x86_64.AppImage**]($dl/Tontolo-$v-x86_64.AppImage) | 🐧 **Linux** (Ubuntu 22.04+, Debian 12+, Fedora, Arch…) : \`chmod +x\` puis double-clic | $(size Tontolo-$v-x86_64.AppImage) |"
            echo "| [tontolo-$v-py3-none-any.whl]($dl/tontolo-$v-py3-none-any.whl) | 🧑‍💻 Ligne de commande et serveur compatible OpenAI (Python ≥ 3.11) | $(size tontolo-$v-py3-none-any.whl) |"
            echo "| [SHA256SUMS]($dl/SHA256SUMS) | 🔒 Empreintes pour vérifier les fichiers | |"
            echo
            echo "> Déjà installé ? Tontolo se met à jour tout seul (depuis n'importe quelle version ≥ 0.2.0). Alerte « Play Protect » : normale hors Play Store, touchez « Analyser »."
            echo
            echo "## ✨ Nouveautés de la version $v"
            echo
            cat changes.md
            echo
            echo "## 📖 Détails"
            echo
            cat .github/release-compat.md
            echo
            echo "Vérification : \`sha256sum -c SHA256SUMS --ignore-missing\`"
          } > notes.md
      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Tontolo ${GITHUB_REF_NAME}" --notes-file notes.md
