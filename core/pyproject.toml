[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tontolo"
version = "0.5.5"
description = "Hub d'IA libre : choisit automatiquement le meilleur modèle gratuit, bascule sur quota épuisé et revient au meilleur."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "RANIRIAMANJAKA Antsa", email = "antsa.raniriamanjaka@univ-antananarivo.mg" }]
keywords = ["llm", "router", "openrouter", "free", "ai", "agent", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: French",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Android",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Dépendances minimales communes à Linux et Android (toutes pures Python,
# sauf pydantic-core et pyyaml, disponibles en roues Android sur pypi.flet.dev).
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "aiosqlite>=0.20",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",
  "python-multipart>=0.0.9",
  "pypdf>=5",  # documents PDF (pur Python, BSD)
]

[project.optional-dependencies]
# Recherche web sans clé (ddgs) ; primp est disponible pour Android.
search = ["ddgs>=9.0"]
# Extraction de texte de meilleure qualité (lxml : plus lourd, Linux surtout).
extract = ["trafilatura>=2.0"]
mcp = ["mcp>=1.10"]
math = ["sympy>=1.13"]
# Routage LiteLLM optionnel côté Linux (lourd : non embarqué sur Android).
litellm = ["litellm>=1.50"]
keyring = ["keyring>=25"]
linux = ["tontolo[search,extract,mcp,math,keyring]"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "openai>=1.40",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
tontolo = "tontolo.cli:main"

[project.urls]
Homepage = "https://github.com/raantss18/tontolo"
Issues = "https://github.com/raantss18/tontolo/issues"

[tool.hatch.build.targets.wheel]
packages = ["tontolo"]

[tool.hatch.build.targets.sdist]
include = ["tontolo", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC240"]  # textes français ; petits accès fichiers

[tool.mypy]
python_version = "3.11"
packages = ["tontolo"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["network: test nécessitant Internet (désactivé par défaut en CI)"]
addopts = "-m 'not network'"

[tool.ruff.lint.per-file-ignores]
# Gabarits XML Office Open : des lignes longues restent plus lisibles que découpées.
"tontolo/creator/docx.py" = ["E501"]
"tontolo/creator/office.py" = ["E501"]
# Bancs d'essai (endurance, charge, essais réels) : scripts jetables, pas du code livré.
"bench/**" = ["E501", "ASYNC221", "RUF059", "SIM115", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
