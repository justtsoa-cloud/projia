<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projia</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/chat.css">
<link rel="stylesheet" href="/css/creations.css">
<link rel="stylesheet" href="/css/settings.css">
</head>
<body>
<div id="app-shell">
  <header id="topbar">
    <div class="brand">
      <img src="/assets/mark.svg" alt="">
      <span>Projia</span>
    </div>
    <nav id="main-nav">
      <button data-route="chat" aria-selected="true">Discussion</button>
      <button data-route="creations">Créations</button>
      <button data-route="settings">Réglages</button>
    </nav>
    <div class="spacer"></div>
    <div class="model-chip" id="model-chip" title="">
      <span class="health-dot" id="health-dot" data-state=""></span>
      <span id="model-chip-label">Auto</span>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="toast-stack" id="toasts"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
